
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANTIAGO | Login & Register</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;background:#f6f7fb;
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;color:#172440;
}
.container{
  width:100%;max-width:430px;background:white;
  padding:35px;border-radius:20px;
  box-shadow:0 12px 45px #17244012;
}
.logo{text-align:center;font-size:27px;font-weight:900;letter-spacing:2px;margin-bottom:12px}
.logo span{color:#7658db}
.subtitle{text-align:center;color:#858ba0;font-size:14px;margin-bottom:30px}
.tabs{display:flex;background:#f3f2f9;padding:5px;border-radius:10px;margin-bottom:25px}
.tabs button{
  width:50%;padding:12px;border:0;background:transparent;
  border-radius:8px;font-weight:bold;color:#777;cursor:pointer;
}
.tabs button.active{background:white;color:#7658db;box-shadow:0 2px 7px #0000000b}
.field{margin-bottom:17px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
input{
  width:100%;padding:14px;border:1px solid #e7e7ef;
  border-radius:9px;outline:none;font-size:14px;
}
input:focus{border-color:#7658db}
.submit{
  width:100%;padding:15px;background:#7658db;
  border:0;border-radius:9px;color:white;font-weight:bold;
  cursor:pointer;margin-top:5px;
}
.submit:disabled{opacity:.6;cursor:wait}
.message{
  display:none;padding:12px;border-radius:8px;
  margin-bottom:16px;font-size:13px;line-height:1.5;
}
.message.error{display:block;background:#fff0f0;color:#bd3333}
.message.success{display:block;background:#effaf2;color:#237b3d}
.footer{text-align:center;color:#9295a3;font-size:12px;margin-top:25px}
.hidden{display:none}
</style>
</head>
<body>

<div class="container">
  <div class="logo">SANTIAGO<span>.</span></div>
  <p class="subtitle">Your digital services platform</p>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showForm('login')">Login</button>
    <button id="registerTab" onclick="showForm('register')">Create account</button>
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">
    <div class="field">
      <label>Email address</label>
      <input id="loginEmail" type="email" placeholder="Enter your email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter your password" required>
    </div>
    <button class="submit" type="submit">Login to account</button>
  </form>

  <form id="registerForm" class="hidden">
    <div class="field">
      <label>Full name</label>
      <input id="fullName" type="text" placeholder="Enter your full name" required>
    </div>
    <div class="field">
      <label>Email address</label>
      <input id="registerEmail" type="email" placeholder="Enter your email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="registerPassword" type="password" minlength="8" placeholder="At least 8 characters" required>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input id="confirmPassword" type="password" minlength="8" placeholder="Confirm your password" required>
    </div>
    <button class="submit" type="submit">Create my account</button>
  </form>

  <div class="footer">© 2026 SANTIAGO. All rights reserved.</div>
</div>

<script>
const SUPABASE_URL = "https://anzrwkwyjcdessheviyw.supabase.co";
const SUPABASE_KEY = "sb_publishable_txD8O7D0v34s59Z2p-nqaA_6ur0PFFX";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const messageBox = document.getElementById("message");

function showMessage(message,type){
  messageBox.textContent=message;
  messageBox.className="message "+type;
}

function clearMessage(){
  messageBox.textContent="";
  messageBox.className="message";
}

function showForm(form){
  clearMessage();
  const login=form==="login";
  document.getElementById("loginForm").classList.toggle("hidden",!login);
  document.getElementById("registerForm").classList.toggle("hidden",login);
  document.getElementById("loginTab").classList.toggle("active",login);
  document.getElementById("registerTab").classList.toggle("active",!login);
}

async function checkSession(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error) return;
  if(data.session){
    window.location.href="index.html";
  }
}
checkSession();

document.getElementById("loginForm").addEventListener("submit",async function(e){
  e.preventDefault();
  clearMessage();

  const button=this.querySelector("button");
  button.disabled=true;
  button.textContent="Logging in...";

  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({
      email:document.getElementById("loginEmail").value.trim(),
      password:document.getElementById("loginPassword").value
    });

    if(error) throw error;

    showMessage("Login successful. Opening your dashboard...","success");
    window.location.href="index.html";
  }catch(error){
    showMessage(error.message,"error");
  }finally{
    button.disabled=false;
    button.textContent="Login to account";
  }
});

document.getElementById("registerForm").addEventListener("submit",async function(e){
  e.preventDefault();
  clearMessage();

  const name=document.getElementById("fullName").value.trim();
  const email=document.getElementById("registerEmail").value.trim();
  const password=document.getElementById("registerPassword").value;
  const confirm=document.getElementById("confirmPassword").value;
  const button=this.querySelector("button");

  if(password!==confirm){
    showMessage("Your passwords do not match.","error");
    return;
  }

  button.disabled=true;
  button.textContent="Creating account...";

  try{
    const {data,error}=await supabaseClient.auth.signUp({
      email,
      password,
      options:{
        data:{full_name:name}
      }
    });

    if(error) throw error;

    if(data.session){
      showMessage("Account created successfully! Opening dashboard...","success");
      window.location.href="index.html";
    }else{
      showMessage("Registration successful. Check your email to confirm your account before logging in.","success");
      showForm("login");
    }
  }catch(error){
    showMessage(error.message,"error");
  }finally{
    button.disabled=false;
    button.textContent="Create my account";
  }
});
</script>
</body>
</html>
